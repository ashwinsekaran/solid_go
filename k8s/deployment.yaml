apiVersion: apps/v1
kind: Deployment
metadata:
  name: "llm-gateway"
  namespace: default

spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      containers:
        - name: llm-gateway
          image: ghcr.io/llm-gateway/llm-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: "llm-gateway-config"
            - secretRef:
                name: "llm-gateway-secret"

          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"