apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "llm-gateway"
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: "api.example.com"
      http:
        paths:
          - path: "/llm"
            pathType: Prefix
            backend:
              service:
                name: "llm-gateway"
                port:
                  number: 80
