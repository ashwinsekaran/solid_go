replicaCount: 2


llm-gateway:
  image:
    repository: example.com/llm-gateway
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  targetPort: 8080
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  hpa:
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70
  config:


common:
  pullPolicy: IfNotPresent

