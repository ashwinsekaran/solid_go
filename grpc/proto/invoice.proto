syntax="proto3";

package invoice;

option go_package="./proto";

message Invoice {
    string customer = 1;
    double amount = 2;
}

message InvoiceResponse {
  string message = 1;
}

service InvoiceService {
  rpc CreateInvoice(Invoice) returns (InvoiceResponse);
  rpc ListInvoices(Invoice) returns (stream InvoiceResponse);
  rpc UploadInvoices(stream Invoice) returns (InvoiceResponse);
  rpc SyncInvoices(stream Invoice) returns (stream InvoiceResponse);
}