version: "3.8"
services:

  llm-gateway:
    build:
      context: .
      dockerfile: worker_pool_api_processer/Dockerfile
#    image: llm-gateway:v1
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prom.yaml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus